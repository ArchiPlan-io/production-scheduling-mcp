[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "production-scheduling-mcp"
version = "0.1.0"
description = "A small OR-Tools production scheduler for MCP assistants"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ArchiPlan" }]
dependencies = ["mcp>=1.9,<2", "ortools>=9.12,<10"]

[project.scripts]
production-scheduling-mcp = "production_scheduling_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["production_scheduling_mcp"]
